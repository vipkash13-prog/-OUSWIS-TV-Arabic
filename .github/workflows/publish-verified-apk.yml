name: Publish emulator-verified OUSWIS TV 1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/OUSWIS-TV-1.0.apk', '.github/workflows/publish-verified-apk.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact APK already installed in Android 14 emulator
        run: |
          echo '15cf2f02365441c8ad2181a83821f6e679ebb8ca60d966425bd43d6dacd51659  dist/OUSWIS-TV-1.0.apk' | sha256sum --check
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs dist/OUSWIS-TV-1.0.apk > "$RUNNER_TEMP/signature.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: 01fe551ebdc98f87521e57223787da29ad660cbc87cfc16ef3e9e18678cc7bee' "$RUNNER_TEMP/signature.txt"
          "$bt/aapt2" dump badging dist/OUSWIS-TV-1.0.apk > "$RUNNER_TEMP/metadata.txt"
          grep -Fq "package: name='io.freemytv' versionCode='10002' versionName='1.0'" "$RUNNER_TEMP/metadata.txt"
          grep -Fq 'Pulled installed base.apk and compared SHA-256' docs/maintenance/android14-install-result.txt
      - name: Publish the verified bytes without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0-build10002 dist/OUSWIS-TV-1.0.apk docs/maintenance/android14-install-result.txt --clobber
          echo 'https://github.com/vipkash13-prog/-OUSWIS-TV-Arabic/releases/download/v1.0-build10002/OUSWIS-TV-1.0.apk' >> "$GITHUB_STEP_SUMMARY"
