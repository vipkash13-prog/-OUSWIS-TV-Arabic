name: Probe ESPN slugs
on:
  push:
    branches: ['feature/**']
    paths: ['.github/workflows/probe-espn.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which competitions answer
        run: |
          for s in caf.nations_qual caf.nations fifa.worldq.caf fifa.worldq.uefa fifa.worldq.conmebol fifa.worldq.concacaf fifa.worldq.afc fifa.friendly uefa.nations uefa.wchampions caf.champions concacaf.nations.league uefa.euroq uefa.euro afc.champions afc.cup afc.champions2 fifa.cwc uefa.super_cup eng.2 club.friendly; do
            code=$(curl -s -m 20 -o /tmp/e.json -w "%{http_code}" "https://site.api.espn.com/apis/site/v2/sports/soccer/$s/scoreboard?dates=20261101-20261130&limit=1000")
            python3 - "$s" "$code" <<'P'
          import json,sys
          s,code=sys.argv[1:3]
          try:
              d=json.load(open('/tmp/e.json')); n=d['leagues'][0]['name'] if d.get('leagues') else '-'
              ev=d.get('events',[]); print(s,code,n,len(ev),[e['name'] for e in ev[:3]])
          except Exception as e: print(s,code,'ERR',e)
          P
          done
      - name: All league slugs ESPN lists
        run: |
          curl -s -m 30 "https://sports.core.api.espn.com/v2/sports/soccer/leagues?limit=1000" -o /tmp/l.json || true
          python3 - <<'P'
          import json
          try:
              d=json.load(open('/tmp/l.json')); print('count',d.get('count')); print([i['$ref'].split('/leagues/')[1].split('?')[0] for i in d['items']][:400])
          except Exception as e: print('ERR',e)
          P
