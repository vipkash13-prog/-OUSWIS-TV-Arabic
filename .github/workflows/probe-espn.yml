name: Probe ESPN slugs
on:
  push:
    branches: ['feature/**']
    paths: ['.github/workflows/probe-espn.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Events near today in the qualifiers
        run: |
          for s in caf.nations_qual fifa.worldq.caf; do
            for m in 202611; do
              curl -s --compressed -m 25 "https://site.api.espn.com/apis/site/v2/sports/soccer/$s/scoreboard?dates=$m&limit=1000" -o /tmp/e.json
              python3 - "$s" <<'P'
          import json,sys
          d=json.load(open('/tmp/e.json'))
          for e in d.get('events',[]):
              if e['date'][:10] in ('2026-11-11','2026-11-12','2026-11-13'):
                  print(sys.argv[1],e['date'],e['name'],e['status']['type']['state'],[c.get('names') for c in e['competitions'][0].get('broadcasts',[])])
          P
            done
          done
