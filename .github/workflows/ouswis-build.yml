name: OUSWIS TV signed APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.sh', 'tools/**', '.github/workflows/ouswis-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ouswis-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Restore existing update signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || {
            echo "Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD for the existing io.freemytv key. Never generate a replacement key."
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ouswis-update.keystore"
          echo "FREEMYTV_KEYSTORE=$RUNNER_TEMP/ouswis-update.keystore" >> "$GITHUB_ENV"
      - name: Check translations and build upgrade baseline
        env:
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/translate.py --check
          node tests/ArabicI18nTest.js
          cp app/AndroidManifest.xml "$RUNNER_TEMP/AndroidManifest.xml"
          trap 'cp "$RUNNER_TEMP/AndroidManifest.xml" app/AndroidManifest.xml' EXIT
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          p = Path('app/AndroidManifest.xml')
          s = p.read_text()
          code = int(re.search(r'android:versionCode="(\d+)"', s)[1])
          assert code >= 10002
          p.write_text(re.sub(r'android:versionCode="\d+"', f'android:versionCode="{code - 1}"', s, count=1))
          PYCODE
          ./build.sh --generic --release
          cp FreeMyTV.apk "$RUNNER_TEMP/previous.apk"
      - name: Build final signed OUSWIS TV 1.0
        env:
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./build.sh --generic --release
          python3 tools/verify-release-apk.py FreeMyTV.apk
          bash tools/test-remote.sh
          bash tools/test-order.sh
      - name: Actual Android 14 installation and update test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: bash tools/test-install-upgrade.sh "$RUNNER_TEMP/previous.apk" FreeMyTV.apk install-evidence
      - name: Save install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OUSWIS-TV-Android14-install-evidence
          path: install-evidence/
          if-no-files-found: warn
      - name: Publish only after successful installation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp FreeMyTV.apk OUSWIS-TV-1.0.apk
          code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' app/AndroidManifest.xml)
          tag="v1.0-build${code}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" OUSWIS-TV-1.0.apk install-evidence/install-upgrade.log \
            --target "$GITHUB_SHA" --title "OUSWIS TV 1.0" \
            --notes "Android 14 emulator installation and in-place upgrade passed. Package io.freemytv; requires the matching existing signing certificate. Physical MECOOL testing is separate."
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/OUSWIS-TV-1.0.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ouswis-update.keystore"
