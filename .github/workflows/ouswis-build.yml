name: OUSWIS TV signed APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.sh', '.github/workflows/ouswis-build.yml', 'signing/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Verify signing secret
        env:
          KEY_PASS: ${{ secrets.OUSWIS_SIGNING_PASSWORD }}
        run: test -n "$KEY_PASS"
      - name: Restore or create permanent signing key
        env:
          KEY_PASS: ${{ secrets.OUSWIS_SIGNING_PASSWORD }}
        run: |
          KEY_PASS="$(printf %s "$KEY_PASS" | sha256sum | cut -d " " -f1)"
          mkdir -p signing
          if [ -f signing/ouswis-release.jks.b64 ]; then
            base64 -d signing/ouswis-release.jks.b64 > "$RUNNER_TEMP/ouswis-release.jks"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/ouswis-release.jks" -storetype PKCS12 -alias ouswis -keyalg RSA -keysize 3072 -validity 10000 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=OUSWIS TV, O=OUSWIS" -noprompt
            base64 -w0 "$RUNNER_TEMP/ouswis-release.jks" > signing/ouswis-release.jks.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/ouswis-release.jks.b64
            git commit -m "Preserve encrypted OUSWIS signing key for future updates"
            git push
          fi
          echo "FREEMYTV_KEYSTORE=$RUNNER_TEMP/ouswis-release.jks" >> "$GITHUB_ENV"
          echo "FREEMYTV_KEYSTORE_PASS=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: ./build.sh --generic
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs FreeMyTV.apk
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: OUSWIS-TV-1.5-STANDALONE-SIGNED
          path: FreeMyTV.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp FreeMyTV.apk OUSWIS-TV-1.5-STANDALONE.apk
          gh release view v1.5-standalone >/dev/null 2>&1 && gh release upload v1.5-standalone OUSWIS-TV-1.5-STANDALONE.apk --clobber || gh release create v1.5-standalone OUSWIS-TV-1.5-STANDALONE.apk --title "OUSWIS TV 1.5 Standalone" --notes "Independent Android TV Arabic build, signed with persistent OUSWIS release key."
