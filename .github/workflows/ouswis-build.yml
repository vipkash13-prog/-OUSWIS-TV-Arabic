name: OUSWIS TV 1.0 build
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.sh"
      - ".github/workflows/ouswis-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Build APK
        run: ./build.sh --generic
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: OUSWIS-TV-1.0-TEST
          path: FreeMyTV.apk
          if-no-files-found: error
