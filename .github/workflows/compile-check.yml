name: Compile check
on:
  push:
    branches: ['feature/**']
    paths: ['app/**', 'tools/java-checks/**', 'build.sh', '.github/workflows/compile-check.yml']
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Titles and team matching (plain JVM)
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/tc" app/src/io/ouswis/tv/standalone/Titles.java app/src/io/ouswis/tv/standalone/TeamNames.java tools/java-checks/TitlesCheck.java
          java -Dfile.encoding=UTF-8 -cp "$RUNNER_TEMP/tc" io.ouswis.tv.standalone.TitlesCheck
      - name: Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Build (debug key, only to prove it compiles)
        run: ./build.sh --generic 2>&1 | tail -60
